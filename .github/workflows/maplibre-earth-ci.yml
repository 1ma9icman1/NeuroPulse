name: MapLibre Earth integration CI

on:
  push:
    branches:
      - fix/remove-solar-sim-restore-earth-view
      - 'feature/**'
  pull_request:
    branches:
      - main
      - fix/remove-solar-sim-restore-earth-view

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
