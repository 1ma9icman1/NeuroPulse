name: Solar simulation integration build
on:
  push:
    branches:
      - feature/planetary-rotation-textured-simulation
  pull_request:
    branches:
      - feature/earth-universe-core
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production bundle
        run: npm run build
